<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Elena</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; background: #fff; display: flex; flex-direction: column; height: 100%; box-shadow: 0 0 15px rgba(0,0,0,0.08); }
        .header { background: #ff4b72; color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #eee; border: 2px solid #fff; object-fit: cover; }
        .header-info h3 { font-size: 16px; font-weight: 600; }
        .header-info p { font-size: 12px; opacity: 0.9; }
        .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.4; word-wrap: break-word; }
        .user { align-self: flex-end; background: #ff4b72; color: #fff; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: #f1f3f5; color: #212529; border-bottom-left-radius: 4px; }
        .input-bar { display: flex; padding: 10px 12px; border-top: 1px solid #eef0f2; background: #fff; gap: 8px; }
        .input-bar input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 14px; }
        .input-bar button { background: #ff4b72; border: none; color: #fff; padding: 0 20px; border-radius: 25px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <div class="avatar" style="background: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150') center/cover;"></div>
            <div class="header-info">
                <h3>Elena 💕</h3>
                <p>Online</p>
            </div>
        </div>
        <div class="messages" id="chatBox">
            <div class="msg bot">Hey! Just grabbed some iced coffee. How's your day going? 😊</div>
        </div>
        <div class="input-bar">
            <input type="text" id="userInput" placeholder="Message Elena...">
            <button onclick="sendMsg()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        let history = [];

        async function sendMsg() {
            const text = userInput.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history })
                });
                const data = await res.json();
                const reply = data.reply || "Haha oops, say that again?";

                chatBox.innerHTML += `<div class="msg bot">${reply}</div>`;
                history.push({ role: 'user', content: text });
                history.push({ role: 'assistant', content: reply });
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div class="msg bot">Connection lost for a sec...</div>`;
            }
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMsg(); });
    </script>
</body>
</html>
